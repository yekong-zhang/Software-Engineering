serif" font-size="30" font-weight="700" fill="#142D42">统计总览</text><text x="295" y="173" font-family="Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400" fill="#708297">按本人活动查看；管理员可在授权范围查看平台汇总。</text><text x="300" y="973" font-family="Noto Sans CJK SC,sans-serif" font-size="12" font-weight="400" fill="#708297">软件设计实验 02   /   UI 概念原型 · Inkscape SVG</text><rect x="300" y="222" width="255" height="142" rx="14" fill="white" stroke="none"/><text x="324" y="260" font-family="Noto Sans CJK SC,sans-serif" font-size="21" font-weight="600" fill="#142D42">容量</text><text x="324" y="331" font-family="Noto Sans CJK SC,sans-serif" font-size="38" font-weight="700" fill="#236BEB">100</text><rect x="575" y="222" width="255" height="142" rx="14" fill="white" stroke="none"/><text x="599" y="260" font-family="Noto Sans CJK SC,sans-serif" font-size="21" font-weight="600" fill="#142D42">占用人数</text><text x="599" y="331" font-family="Noto Sans CJK SC,sans-serif" font-size="38" font-weight="700" fill="#236BEB">88</text><rect x="850" y="222" width="255" height="142" rx="14" fill="white" stroke="none"/><text x="874" y="260" font-family="Noto Sans CJK SC,sans-serif" font-size="21" font-weight="600" fill="#142D42">剩余名额</text><text x="874" y="331" font-family="Noto Sans CJK SC,sans-serif" font-size="38" font-weight="700" fill="#236BEB">12</text><rect x="1125" y="222" width="255" height="142" rx="14" fill="white" stroke="none"/><text x="1149" y="260" font-family="Noto Sans CJK SC,sans-serif" font-size="21" font-weight="600" fill="#142D42">候补中</text><text x="1149" y="331" font-family="Noto Sans CJK SC,sans-serif" font-size="38" font-weight="700" fill="#236BEB">16</text><rect x="300" y="397" width="655" height="401" rx="14" fill="white" stroke="none"/><text x="324" y="435" font-family="Noto Sans CJK SC,sans-serif" font-size="21" font-weight="600" fill="#142D42">正常结束场次 · 签到率</text><text x="324" y="463" font-family="Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400" fill="#708297">演示：已签到 3 / 缺席 1 = 75%</text><rect x="328" y="524" width="591" height="58" rx="9" fill="#EAF0F7" stroke="none"/><rect x="328" y="524" width="443" height="58" rx="9" fill="#236BEB" stroke="none"/><text x="328" y="652" font-family="Noto Sans CJK SC,sans-serif" font-size="55" font-weight="700" fill="#236BEB">75%</text><text x="328" y="712" font-family="Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400" fill="#142D42">分母为零：暂无数据；取消场次不计算。</text><rect x="982" y="397" width="398" height="401" rx="14" fill="white" stroke="none"/><text x="1006" y="435" font-family="Noto Sans CJK SC,sans-serif" font-size="21" font-weight="600" fill="#142D42">容量计算口径</text><text x="1006" y="505" font-family="Noto Sans CJK SC,sans-serif" font-size="16" font-weight="400" fill="#142D42">占用 = 已报名 + 已签到 + 缺席</text><text x="1006" y="557" font-family="Noto Sans CJK SC,sans-serif" font-size="16" font-weight="400" fill="#142D42">候补中、已取消不占名额</text><text x="1006" y="609" font-family="Noto Sans CJK SC,sans-serif" font-size="16" font-weight="400" fill="#142D42">剩余 = 容量 − 占用</text><text x="1006" y="661" font-family="Noto Sans CJK SC,sans-serif" font-size="16" font-weight="400" fill="#142D42">截止后有余量也不开放报名</text><text x="1006" y="713" font-family="Noto Sans CJK SC,sans-serif" font-size="16" font-weight="400" fill="#142D42">取消范围统计口径：待确认</text><text x="320" y="865" font-family="Noto Sans CJK SC,sans-serif" font-size="16" font-weight="400" fill="#708297">本页两组演示数据相互独立；未确认的取消统计与平台维度不作为验收承诺。</text></svg>